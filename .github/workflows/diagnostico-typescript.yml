name: Diagnóstico GestiónVerde

on:
  push:
    branches:
      - feature/gestionverde-2-base
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --silent

      - name: Capturar diagnósticos
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > typescript-errors.txt 2>&1
          echo "exit_code=$?" >> typescript-errors.txt

          npm run lint > lint-errors.txt 2>&1
          echo "exit_code=$?" >> lint-errors.txt

          npm run build > build-errors.txt 2>&1
          echo "exit_code=$?" >> build-errors.txt

          node --test tests/*.test.mjs > test-errors.txt 2>&1
          echo "exit_code=$?" >> test-errors.txt

          git ls-files | sort > repository-files.txt
          grep -RInE "ROUTE_DATA_KEY|AES-GCM|worker/vault|private-route|data-crypto|encrypt-route" . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude=package-lock.json \
            > legacy-references.txt 2>&1
          echo "grep_exit_code=$?" >> legacy-references.txt
          exit 0

      - name: Subir diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: gestionverde-diagnostics
          path: |
            typescript-errors.txt
            lint-errors.txt
            build-errors.txt
            test-errors.txt
            repository-files.txt
            legacy-references.txt
          retention-days: 1
